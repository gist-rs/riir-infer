# FORK DIVERGENCE (riir-ai Issue 945, 2026-09-14): upstream requests
# features = ["cache"] here, which drags cubecl-environment's optional
# rusqlite (libsqlite3-sys, plain sqlite3.o) into EVERY native cubecl
# binary. Under --all-features that collides at link time with libsql's
# sqlite3mc (duplicate _sqlite3_* symbols) in any test binary that also
# links turso_cold (e.g. riir-games npc_dialog_e2e_test). Nothing in this
# workspace calls the environment bundle/sqlite-cache APIs (autotune
# persistence routes via std_io per build.rs), so the feature is dropped
# with zero behavior change. Diff vs Cargo.toml.orig documents this.
default-features = false

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies.serde_json]
version = "1.0.119"
features = ["std"]
default-features = false


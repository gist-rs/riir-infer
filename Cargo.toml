[package]
name = "riir-infer-core"
version = "0.1.1"
edition = "2024"
license = "MIT"
# Not published yet — the public opening is owner-gated and rides the
# fence-gate checklist first (fresh history, sanitized docs, import fence).
publish = false

# riir-infer-core — the LLM inference substrate: GGUF/safetensors weight
# loading, the quantization zoo, architecture definitions (gemma / llama /
# ternary / wall layers, deltanet, transformer, rope), and CPU reference
# paths. NO cognition, NO training, NO game/chain semantics — upstream of
# all of them. Consumed by inference engines via path dep; sibling crates
# resolve at ../katgpt-rs.
#
# Feature table mirrors the engine features that gate the code; consumers
# forward each of their copies: `X = [..., "riir-infer-core/X"]`.

[dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
# default-features = false: mirrors riir-engine (kog_cpu_fusion off).
katgpt-transformer = { path = "../katgpt-rs/crates/katgpt-transformer", default-features = false }
# katgpt-speculative: shared DDTree substrate (dflash.rs et al.).
katgpt-speculative = { path = "../katgpt-rs/crates/katgpt-speculative" }
# katgpt-forward: canonical clustered LM head + standard head (transformer/mtp.rs).
katgpt-forward = { path = "../katgpt-rs/crates/katgpt-forward" }
# katgpt-quant: canonical TurboQuant — the `crate::turboquant` re-export
# consumed by the moved model layer (optional, pulled by `turboquant`).
katgpt-quant = { path = "../katgpt-rs/crates/katgpt-quant", optional = true }
# katgpt-attn: flashmemory_gqa only (optional; engine keeps its own copy for
# latent_functor/static_cal_bridge.rs which does NOT move).
katgpt-attn = { path = "../katgpt-rs/crates/katgpt-attn", optional = true }

half = "2"
rayon = "1.10"
anyhow = "1"
memmap2 = "0.9"
fastrand = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = "1"

# SentencePiece tokenizer — Gemma 2/LLaMA text tokenization (Plan 087).
# Native-only: pulls sentencepiece-sys (C++ via cmake) which cannot compile
# for wasm32; the tokenizer module below carries the matching gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentencepiece = "0.13"

[features]
# Pure-local gates (no dep forwards).
rotary_value_embedding = []
hla = []
raven = []
gemma_lora = []
lora_still = []
# EXL3 (trellis-coded, QTIP-variant) safetensors-side quant — CPU reference
# dequantization, opt-in until the Issue-001 T6 GOAT gate (workspace rule).
exl3 = []
# vk_calibration (katgpt-rs Issue 883 P0, 2026-09-25): the gemma-2 V/K
# calibration lane — `transformer::gemma2_calibration` (tapped f16
# forward, no lm_head) + the `vk_calibration` bin (the offline R²
# dashboard over a natural-text corpus; measurement-only by the issue's
# P0 law). Forwards katgpt-core's `fitted_anchor_tables` (the shared
# 882+883 substrate, katgpt-rs Bench 886). OPT-IN per the
# no-default-consumer rule — the dashboard is an offline instrument,
# never a serving path.
vk_calibration = ["katgpt-core/fitted_anchor_tables"]
# row_logit_floor (riir-infer Issue 011 T1, 2026-09-25): the opt-in consumer
# of katgpt-core's sink-exempt row-logit floor + b-bit logit code +
# exp-table softmax (katgpt-rs Issue 882 P2, Bench 888) —
# `transformer::attention_floor`, selected per call by
# `ForwardContext::logit_floor` on the gemma-2 f16 forward, + the
# `row_logit_floor_ppl` bin (the T2/T4 quality gate). OPT-IN: promotion is
# katgpt-rs-side and waits on T2 + T3.
row_logit_floor = ["katgpt-core/row_logit_floor"]
# attention_to_answer (katgpt-rs Issue 882 P4, 2026-09-25): the m_Y probe —
# attention mass on a labeled answer span, per (layer, head), read off the
# gemma-2 f16 forward on ARMED rows only (one extra QK pass there; the
# attention kernels are untouched). Reproduces the row_logit_floor policy
# when both are on. Offline instrument, opt-in.
attention_to_answer = []

# katgpt-core forwards.
sparse_mlp = ["katgpt-core/sparse_mlp"]
domain_latent = ["katgpt-core/domain_latent"]
dllm = ["katgpt-core/dllm"]
simd_lut_q4k = ["katgpt-core/simd_lut_dequant"]
causal_validation = ["katgpt-core/adaptive_causal_calibration"]
deltanet_inference = ["katgpt-core/deltanet_inference"]
gemma4_inference = ["katgpt-core/gemma4_inference"]
q2_0_ternary_bridge = ["katgpt-core/ternary_group_scale"]
ternary_inference = ["katgpt-core/ternary_inference", "q2_0_ternary_bridge"]
gdn_tree_verify = ["deltanet_inference", "katgpt-core/gdn_tree_verify"]
hydra_budget = ["katgpt-core/hydra_budget"]
rim_slots = ["katgpt-core/rim_slots"]
collapse_aware_thinking = ["katgpt-core/collapse_aware_thinking"]
belief_drafter = ["katgpt-core/belief_drafter"]

# katgpt-transformer forwards.
gated_mlp = ["katgpt-transformer/gated_mlp"]
delta_routing = ["katgpt-transformer/delta_routing"]
wall_attention = ["katgpt-core/wall_attention", "katgpt-transformer/wall_attention"]

# katgpt-attn / katgpt-quant / katgpt-speculative forwards.
flashmemory_gqa = ["dep:katgpt-attn", "katgpt-attn/flashmemory_sparse"]
flashmemory_trained_indexer = ["flashmemory_gqa", "katgpt-attn/trained_indexer"]
turboquant = ["dep:katgpt-quant", "katgpt-quant/turboquant"]
weaver_runtime = ["katgpt-speculative/weaver_runtime"]

# Inter-feature composition (mirrors engine; hla_role_transport stays
# engine-local — the moved gated arms reference no engine types, verified
# by the T1.4 back-edge check).
deltanet_ternary_inference = ["deltanet_inference", "q2_0_ternary_bridge"]
# Bonsai 2 Hadamard-folded ternary runtime (Issue 980 / Plan 600 Phase B).
# Parses prism.hadamard.* + applies the activation-side rotation. Default-OFF
# until the GOAT gate passes (G1 token-identity vs the fork, G2 overhead
# budget, G3 flag-off byte-identity on the old file, G4 alloc-free).
bonsai2_hadamard = ["deltanet_ternary_inference"]
forward_profiling = ["deltanet_ternary_inference"]
gemma4_lora = ["gemma4_inference"]
hla_role_aware = ["hla"]
set_diffusion = ["dllm"]

# Issue 879 T1 — the GDN quant-certification harness needs BOTH the deltanet
# CPU reference (deltanet_inference) and the Q2_0 repack/container
# (q2_0_ternary_bridge → ternary_group_scale). The file carries a matching
# #![cfg] (green-zero protection); this row is the reader protection
# (katgpt-rs .issues/713): a --features selection without the union SKIPS
# the target loudly instead of compiling it to an empty binary.
[[test]]
name = "issue879_gdn_quant_certification"
required-features = ["deltanet_ternary_inference"]

# Issue 980 / Plan 600 Phase B — synthetic Bonsai-2 loader + rotation tests.
# #![cfg(feature = "bonsai2_hadamard")] protects the count; this row protects
# the reader (a --features selection without the union SKIPS loudly instead
# of printing a green zero).
[[test]]
name = "bonsai2_rotation_load"
required-features = ["bonsai2_hadamard"]

# katgpt-rs Issue 883 P0 — the V/K calibration dashboard bin. The module
# lives behind #[cfg(feature = "vk_calibration")]; this row is the reader
# protection (the green-zero law): a default build SKIPS the bin loudly
# instead of compiling it to an empty binary.
[[bin]]
name = "vk_calibration"
path = "src/bin/vk_calibration.rs"
required-features = ["vk_calibration"]

[[bin]]
name = "row_logit_floor_ppl"
path = "src/bin/row_logit_floor_ppl.rs"
required-features = ["row_logit_floor", "attention_to_answer"]

# ─── Workspace ────────────────────────────────────────────────────────
# The repo is a root-package workspace: riir-infer-core at the root,
# the GPU kernel layer as a member (it carries the wgpu/cubecl tree,
# which CPU-only consumers of the core never resolve into their builds),
# and the pinned-checkpoint encoder lane as a member (it carries the
# tokenizers/gemm tree, which lane-free consumers never resolve).
[workspace]
members = ["crates/riir-infer-gpu", "crates/riir-infer-laya"]

# Shared dep declarations for members (the fence resolves path deps from
# each manifest's own directory, so member manifests inherit this instead
# of spelling the sibling path one level deeper).
[workspace.dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }

# ─── Local patches (crates.io forks) ─────────────────────────────────
# Byte-identical copies of the patched crates.io sources under vendor/.
# Remove when upstream lands the fixes:
#   cubecl-runtime — drop-queue policy fix (upstream tracel-ai/cubecl#1359).
#   wgpu-hal       — total_video_memory_bytes()/raw_handle() adapter
#                    accessors (additive API; the VRAM pre-flight probes it).

[patch.crates-io]
cubecl-runtime = { path = "vendor/cubecl-runtime-0.11.0-pre.2" }
wgpu-hal = { path = "vendor/wgpu-hal-30.0.0" }

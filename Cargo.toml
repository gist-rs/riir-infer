[package]
name = "riir-infer-core"
version = "0.1.1"
edition = "2024"
license = "MIT"
# Not published yet — the public opening is owner-gated and rides the
# fence-gate checklist first (fresh history, sanitized docs, import fence).
publish = false

# riir-infer-core — the LLM inference substrate: GGUF/safetensors weight
# loading, the quantization zoo, architecture definitions (gemma / llama /
# ternary / wall layers, deltanet, transformer, rope), and CPU reference
# paths. NO cognition, NO training, NO game/chain semantics — upstream of
# all of them. Consumed by inference engines via path dep; sibling crates
# resolve at ../katgpt-rs.
#
# Feature table mirrors the engine features that gate the code; consumers
# forward each of their copies: `X = [..., "riir-infer-core/X"]`.

[dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
# katgpt-types: named directly for the `act_aware_fit` enum
# (ActAwareScaleFit) — the scale-fit API lives on TernaryGroupWeights in
# types (Issue 886 P1), and katgpt-core forwards the FEATURE but not the
# enum. Same upstream repo; version walks with katgpt-core by construction.
katgpt-types = { path = "../katgpt-rs/crates/katgpt-types" }
# default-features = false: mirrors riir-engine (kog_cpu_fusion off).
katgpt-transformer = { path = "../katgpt-rs/crates/katgpt-transformer", default-features = false }
# katgpt-speculative: shared DDTree substrate (dflash.rs et al.).
katgpt-speculative = { path = "../katgpt-rs/crates/katgpt-speculative" }
# katgpt-forward: canonical clustered LM head + standard head (transformer/mtp.rs).
katgpt-forward = { path = "../katgpt-rs/crates/katgpt-forward" }
# katgpt-quant: canonical TurboQuant — the `crate::turboquant` re-export
# consumed by the moved model layer (optional, pulled by `turboquant`).
katgpt-quant = { path = "../katgpt-rs/crates/katgpt-quant", optional = true }
# katgpt-attn: flashmemory_gqa only (optional; engine keeps its own copy for
# latent_functor/static_cal_bridge.rs which does NOT move).
katgpt-attn = { path = "../katgpt-rs/crates/katgpt-attn", optional = true }
# katgpt-kv: the KVarN V-cache quantizer backend (Issue 013 T1 lane).
# default-features = false: the kvarn backend is feature-selected explicitly
# (both Issue-013 consumers — fitted_v_tables + gemma2_qkv — pull kvarn by
# name), so the namespace crate's defaults stay out of every other posture.
katgpt-kv = { path = "../katgpt-rs/crates/katgpt-kv", optional = true, default-features = false }

half = "2"
rayon = "1.10"
anyhow = "1"
memmap2 = "0.9"
fastrand = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = "1"

# SentencePiece tokenizer — Gemma 2/LLaMA text tokenization (Plan 087).
# Native-only: pulls sentencepiece-sys (C++ via cmake) which cannot compile
# for wasm32; the tokenizer module below carries the matching gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentencepiece = "0.13"

[features]
# Pure-local gates (no dep forwards).
rotary_value_embedding = []
hla = []
raven = []
gemma_lora = []
lora_still = []
# EXL3 (trellis-coded, QTIP-variant) safetensors-side quant — CPU reference
# dequantization, opt-in until the Issue-001 T6 GOAT gate (workspace rule).
exl3 = []
# Issue 027 / Plan 615: the offline LUT-grid lane — `quant::lut_grid` (the
# solver + histogram, UNGATED in the lib) + the `lut_grid_solve` bin
# (extraction + weight-space 3-arm eval over the dense GGUF artifacts).
# Measurement-only; the model-level G1 (Plan 615 T6) is a separate gate.
lut_grid = []
# vk_calibration (katgpt-rs Issue 883 P0, 2026-09-25): the gemma-2 V/K
# calibration lane — `transformer::gemma2_calibration` (tapped f16
# forward, no lm_head) + the `vk_calibration` bin (the offline R²
# dashboard over a natural-text corpus; measurement-only by the issue's
# P0 law). Forwards katgpt-core's `fitted_anchor_tables` (the shared
# 882+883 substrate, katgpt-rs Bench 886). OPT-IN per the
# no-default-consumer rule — the dashboard is an offline instrument,
# never a serving path.
vk_calibration = ["katgpt-core/fitted_anchor_tables"]
# gemma2_qkv (riir-infer Issue 013 T1, 2026-09-28): the serve-shaped
# quantized-KV gemma-2 forward — `transformer::gemma2_quantized` (the
# `forward_gemma2_f16` layer stack with the KV cache behind the
# `QuantizedKVCache` trait + a dequant mirror; T2/T3 consume the same
# forward). Forwards katgpt-core's `fitted_value_tables` (the P1
# `MeanRemovedValueCache` decorator — implies the fitted_anchor_tables
# substrate) and pulls katgpt-kv/kvarn (the designated backend, BOUNDARY
# allowlist row added with this feature). OPT-IN: a measurement-lane
# capability, never a default-feature serving path.
gemma2_qkv = ["katgpt-core/fitted_value_tables", "dep:katgpt-kv", "katgpt-kv/kvarn"]
# vk_p1_g1 (riir-infer Issue 013 T1, 2026-09-28): the P1 model-bound G1
# bin — calibration slice → FittedTokenTable, then the PPL arms
# (f16 control / plain-KVarN / mean-removed) + the cache-level MSE replay
# against the same f16-trajectory captures (Gate 1), all under the
# pre-registered protocol in the issue. Implies both halves above.
# OPT-IN, measurement-only (the P0 law carries: the bin makes no serving
# claim; Gate 2 decides quality).
vk_p1_g1 = ["vk_calibration", "gemma2_qkv"]
# row_logit_floor (riir-infer Issue 011 T1, 2026-09-25): the opt-in consumer
# of katgpt-core's sink-exempt row-logit floor + b-bit logit code +
# exp-table softmax (katgpt-rs Issue 882 P2, Bench 888) —
# `transformer::attention_floor`, selected per call by
# `ForwardContext::logit_floor` on the gemma-2 f16 forward, + the
# `row_logit_floor_ppl` bin (the T2/T4 quality gate). OPT-IN: promotion is
# katgpt-rs-side and waits on T2 + T3.
row_logit_floor = ["katgpt-core/row_logit_floor"]
# act_diagonal_calibration (riir-infer Issue 014 T1, 2026-09-26): the
# activation-diagonal collector over the Bonsai-2 ternary lane — the
# `vk_calibration` shape at the Issue-886 tap points (linear-layer INPUTS,
# observed beside each ternary matvec through the existing
# `TernaryMatvecHook` seam; the forward runs the same CPU SIMD kernel, so
# the pass is bit-identical to an unhooked run). Forwards katgpt-core's
# `act_channel_moments` (Issue 886 P0). OPT-IN, measurement-only: the
# artifact is the T2 refit input, never a serving path. Implies the
# bonsai-2 loading stack (ternary_inference + bonsai2_hadamard) because
# the collector walks the qwen35 hybrid ternary weights.
act_diagonal_calibration = [
    "katgpt-core/act_channel_moments",
    "ternary_inference",
    "bonsai2_hadamard",
]
# act_scale_refit (riir-infer Issue 014 T2/T3, 2026-09-26): the act-aware
# ternary scale-refit arms + the per-family conditional retention walk that
# gates them (the katgpt-rs Issue 886 P1 model-bound quality gate — the walk
# katgpt-rs cannot run: it needs the born-ternary, Hadamard-rotated Bonsai-2
# checkpoint). Forwards katgpt-core's `act_aware_fit` (WeightedMeanAbs /
# WeightedSearch group-scale fits, Bench 896). OPT-IN, measurement-only:
# refit payloads live in-process for the walk's lifetime; nothing is written
# back to the checkpoint.
act_scale_refit = ["act_diagonal_calibration", "katgpt-core/act_aware_fit"]
# attention_to_answer (katgpt-rs Issue 882 P4, 2026-09-25): the m_Y probe —
# attention mass on a labeled answer span, per (layer, head), read off the
# gemma-2 f16 forward on ARMED rows only (one extra QK pass there; the
# attention kernels are untouched). Reproduces the row_logit_floor policy
# when both are on. Offline instrument, opt-in.
attention_to_answer = []
# twt_profile (riir-infer Issue 022, 2026-09-27): the TWT phase-collapse
# PoC lane — the S-matrix profiler (PairCosineAccum + streaming builder,
# cosine + projected-SVCCA meter arms), the min-max DP partition, the ΔS
# quant-damage map, and the `twt_laya_profile` capture driver. OPT-IN per
# the feature-flag discipline: never a default without the Phase-5 GOAT
# gate. Forwards katgpt-core's `svd_cca` (the public `svcca_into` meter
# arm) AND `minmax_partition` (Plan 616, 2026-10-02: the partition DP +
# SMatrix + PairCosineAccum promoted verbatim to katgpt-core — this
# crate's twt::partition/smatrix/accum are re-export shims at the
# historical paths; the lane keeps only the kill rule + the streaming
# builder + capture drivers). The laya capture hook
# (`Encoder::forward_capture`) rides the SAME-named feature on the lane
# crate (no deps on either side — pure compile gating).
twt_profile = ["katgpt-core/svd_cca", "katgpt-core/minmax_partition"]
# twt_bonsai (riir-infer Issue 022 T1.2, 2026-09-28): the Bonsai/GDN
# capture sibling — the league model's Phase-1 profile driver
# (`twt_bonsai_profile`). Implies the bonsai-2 loading stack because the
# root-crate ternary forward IS the league-model lane (deltanet_ternary
# + the Issue-980 Hadamard rotation).
twt_bonsai = ["twt_profile", "bonsai2_hadamard"]
# twt_collapse (riir-infer Issue 022 Phase 4, 2026-09-29): the collapsed-
# checkpoint lane — the T4.1 re-ternarization arms + the T4.2 κ budget
# (`twt::ternarize`) + the T4.3 collapsed-GGUF writer
# (`twt::collapse_writer`). Implies `deltanet_ternary_inference`
# (→ `q2_0_ternary_bridge`): the arms emit the TernaryGroupWeights
# container, the wire pack emits Q2_0 blocks, and the probe/writer read
# real ternary-hybrid GGUFs. OPT-IN: the Phase-5 GOAT gate decides any
# promotion; nothing here touches a serving path.
twt_collapse = ["twt_profile", "deltanet_ternary_inference"]
# twt_gemma2 (riir-infer Issue 022 T5.1 lane 1, 2026-09-29): the gemma-2-2b
# f16 CONTROL capture driver (`twt_gemma2_profile`) — the cheapest T5.1
# lane: a dense f16 parent with zero quantization interaction, so the
# profile → partition → collapsed-GGUF → agreement pipeline is adjudicated
# with every lane constant except depth. Implies `vk_calibration` because
# the capture rides `forward_gemma2_f16_tapped` (the Issue-883 calibration
# forward + the Issue-395 post-layer hook); the V/K tables are lane baggage
# the S-matrix never reads. OPT-IN per the feature-flag discipline.
twt_gemma2 = ["twt_profile", "vk_calibration"]
# kv_eviction (riir-infer Issue 012, 2026-09-27): the DIFFERENTIAL KV
# eviction consumer — `deltanet::kv_evict` wires katgpt-core's
# `DifferentialEvictTable` (+ the λ=0 max-recent, usage-rate, and
# prompt-pinned-random arms) onto the qwen35-hybrid CPU decode/prefill KV
# path via an Option<&mut EvictorState> seam (None = the existing path,
# bit-identical; armed with budget ≥ context = also bit-identical — that is
# T3). The multi-needle@64K quality gate lives in the
# `needle_eviction_gate` bin. OPT-IN, measurement-only: eviction fires only
# under an armed, under-budget state, and promotion is katgpt-rs-side.
# Implies deltanet_inference (the wired lane) and forwards
# katgpt-core/differential_kv_eviction (which pulls kv_sink_window +
# usage_rate_eviction for the sink pins and the baseline arms).
kv_eviction = [
    "deltanet_inference",
    "katgpt-core/differential_kv_eviction",
]

# fitted_v_tables (riir-infer Issue 013 T1, 2026-09-28): the model-bound P1
# gate lane — `transformer::gemma2_vquant` (the `ValueStoreHook` state:
# KVarN-quantized V storage ± katgpt-core's `MeanRemovedValueCache`
# token-mean decorator, rewritten into the gemma-2 f16 cache at KVarN's own
# tile-close visibility) + the `fitted_v_gate` bin (calibrate → freeze →
# the four-gate battery over the gemma-2-2b decode path). Implies
# vk_calibration (the tapped calibration pass feeds the frozen tables) and
# forwards katgpt-core/fitted_value_tables (the P1 product). OPT-IN,
# measurement-only: the lossy surface is the rewritten cache rows; the
# promotion is katgpt-rs-side and waits on the gates.
fitted_v_tables = [
    "vk_calibration",
    "katgpt-core/fitted_value_tables",
    "dep:katgpt-kv",
    "katgpt-kv/kvarn",
]
# vk_p3_tg (riir-infer Issue 013 T3, 2026-09-29): the P3 V-cache
# reconstruction lane — `transformer::gemma2_vrecon` (the half-split
# `PositionGroupAction` over this forward's own rope table + the
# `VReadPath::Reconstruct` serve state) + the `kv_reconstruct_gate` bin
# (G3 seam probe, the paired store-vs-reconstruct G1, the tg128 paired
# interleave G2, the bytes/token record). Implies the T1/T2 feature family
# (the store-arm reference and the table artifact reader live there) and
# forwards katgpt-core's `fitted_v_reconstruct` (the P3 read-path
# substrate). OPT-IN, measurement-only: promotion is katgpt-rs-side and
# waits on the gates.
vk_p3_tg = ["fitted_v_tables", "katgpt-core/fitted_v_reconstruct"]

# katgpt-core forwards.
sparse_mlp = ["katgpt-core/sparse_mlp"]
domain_latent = ["katgpt-core/domain_latent"]
dllm = ["katgpt-core/dllm"]
simd_lut_q4k = ["katgpt-core/simd_lut_dequant"]
causal_validation = ["katgpt-core/adaptive_causal_calibration"]
deltanet_inference = ["katgpt-core/deltanet_inference"]
gemma4_inference = ["katgpt-core/gemma4_inference"]
q2_0_ternary_bridge = ["katgpt-core/ternary_group_scale"]
ternary_inference = ["katgpt-core/ternary_inference", "q2_0_ternary_bridge"]
gdn_tree_verify = ["deltanet_inference", "katgpt-core/gdn_tree_verify"]
hydra_budget = ["katgpt-core/hydra_budget"]
rim_slots = ["katgpt-core/rim_slots"]
collapse_aware_thinking = ["katgpt-core/collapse_aware_thinking"]
belief_drafter = ["katgpt-core/belief_drafter"]

# katgpt-transformer forwards.
gated_mlp = ["katgpt-transformer/gated_mlp"]
delta_routing = ["katgpt-transformer/delta_routing"]
wall_attention = ["katgpt-core/wall_attention", "katgpt-transformer/wall_attention"]

# katgpt-attn / katgpt-quant / katgpt-speculative forwards.
flashmemory_gqa = ["dep:katgpt-attn", "katgpt-attn/flashmemory_sparse"]
flashmemory_trained_indexer = ["flashmemory_gqa", "katgpt-attn/trained_indexer"]
turboquant = ["dep:katgpt-quant", "katgpt-quant/turboquant"]
weaver_runtime = ["katgpt-speculative/weaver_runtime"]

# Inter-feature composition (mirrors engine; hla_role_transport stays
# engine-local — the moved gated arms reference no engine types, verified
# by the T1.4 back-edge check).
deltanet_ternary_inference = ["deltanet_inference", "q2_0_ternary_bridge"]
# Bonsai 2 Hadamard-folded ternary runtime (Issue 980 / Plan 600 Phase B).
# Parses prism.hadamard.* + applies the activation-side rotation. Default-OFF
# until the GOAT gate passes (G1 token-identity vs the fork, G2 overhead
# budget, G3 flag-off byte-identity on the old file, G4 alloc-free).
bonsai2_hadamard = ["deltanet_ternary_inference"]
forward_profiling = ["deltanet_ternary_inference"]
gemma4_lora = ["gemma4_inference"]
hla_role_aware = ["hla"]
set_diffusion = ["dllm"]

# Issue 879 T1 — the GDN quant-certification harness needs BOTH the deltanet
# CPU reference (deltanet_inference) and the Q2_0 repack/container
# (q2_0_ternary_bridge → ternary_group_scale). The file carries a matching
# #![cfg] (green-zero protection); this row is the reader protection
# (katgpt-rs .issues/713): a --features selection without the union SKIPS
# the target loudly instead of compiling it to an empty binary.
[[test]]
name = "issue879_gdn_quant_certification"
required-features = ["deltanet_ternary_inference"]

# Issue 980 / Plan 600 Phase B — synthetic Bonsai-2 loader + rotation tests.
# #![cfg(feature = "bonsai2_hadamard")] protects the count; this row protects
# the reader (a --features selection without the union SKIPS loudly instead
# of printing a green zero).
[[test]]
name = "bonsai2_rotation_load"
required-features = ["bonsai2_hadamard"]

# Issue 028 T1/T2 — the disaggregated container + phase-handoff battery
# (same-weights byte-identity through the phase split, boundary-freshness
# negative control, one-file `.pf` container, escape-set + compat refusals).
# Whole-file #![cfg(feature = "deltanet_ternary_inference")] protects the
# count; this row protects the reader (a --features selection without the
# union SKIPS the target loudly instead of printing a green zero).
[[test]]
name = "issue028_disaggregated_handoff"
path = "tests/issue028_disaggregated_handoff.rs"
required-features = ["deltanet_ternary_inference"]

# katgpt-rs Issue 883 P0 — the V/K calibration dashboard bin. The module
# lives behind #[cfg(feature = "vk_calibration")]; this row is the reader
# protection (the green-zero law): a default build SKIPS the bin loudly
# instead of compiling it to an empty binary.
[[bin]]
name = "vk_calibration"
path = "src/bin/vk_calibration.rs"
required-features = ["vk_calibration"]

# katgpt-rs Issue 907 — the REAL V-row fixture capture (post-W_V rows off
# the tapped forward, headered + corpus-BLAKE3'd, gitignored under
# .raw/vrow/): the fixture half of the KVarN bit-ladder attribution bench
# (the katgpt-rs side replays these rows through the b2/b3/b4 arms + the
# crossed machinery). Same feature gate + reader protection as the
# dashboard bin (the green-zero law).
[[bin]]
name = "vrow_capture"
path = "src/bin/vrow_capture.rs"
required-features = ["vk_calibration"]

# riir-infer Issue 013 T1 — the fitted-value-table P1 model-bound G1 bin
# (PPL at matched bits with/without mean removal + the cache-level MSE
# replay; pre-registered protocol in the issue).
[[bin]]
name = "vk_p1_g1"
path = "src/bin/vk_p1_g1.rs"
required-features = ["vk_p1_g1"]

[[bin]]
name = "row_logit_floor_ppl"
path = "src/bin/row_logit_floor_ppl.rs"
required-features = ["row_logit_floor", "attention_to_answer"]

# riir-infer Issue 014 T1 — the activation-diagonal collector bin. The
# module lives behind #[cfg(feature = "act_diagonal_calibration")]; this
# row is the reader protection (the green-zero law): a default build
# SKIPS the bin loudly instead of compiling it to an empty binary.
[[bin]]
name = "act_diagonal_calibration"
path = "src/bin/act_diagonal_calibration.rs"
required-features = ["act_diagonal_calibration"]

# riir-infer Issue 014 T2/T3 — the act-aware ternary scale refit + the
# per-family conditional retention walk (the Bench 948 pattern) over the
# Bonsai-2 ternary lane. The module lives behind #[cfg(feature =
# "act_scale_refit")]; this row is the reader protection (the green-zero
# law): a default build SKIPS the bin loudly instead of compiling it to an
# empty binary. Implies the collector feature (the diagonal artifact is the
# refit input) and forwards katgpt-core's `act_aware_fit` (Issue 886 P1:
# WeightedMeanAbs / WeightedSearch group-scale fits).
[[bin]]
name = "act_retention_walk"
path = "src/bin/act_retention_walk.rs"
required-features = ["act_scale_refit"]

# Issue 027 / Plan 615 — the offline LUT-grid solver + weight-space eval
# (dense-GGUF gain site; the model-level gate is Plan 615 T6).
[[bin]]
name = "lut_grid_solve"
path = "src/bin/lut_grid_solve.rs"
required-features = ["lut_grid"]

# Issue 027 / Plan 615 T6 — the model-level per-family retention gate
# (fakequant-at-load over the llama path; MiniCPM5-1B vehicle).
[[bin]]
name = "lut_grid_ppl"
path = "src/bin/lut_grid_ppl.rs"
required-features = ["lut_grid"]

# riir-infer Issue 022 T5.0 — the collapsed-vs-parent top-1 agreement GOAT
# (the T5.1 pre-registered ≥0.9 absolute budget on the qwen35 lane).
# `twt_bonsai` carries deltanet_ternary_inference + bonsai2_hadamard — the
# folded league checkpoint refuses without the latter (loud by design).
[[bin]]
name = "twt_goat_agreement"
path = "src/bin/twt_goat_agreement.rs"
required-features = ["twt_bonsai"]

# riir-infer Issue 022 T5.3 — collapsed-vs-parent decode/prefill perf at the
# quality-matched point: greedy tg loop + teacher-forced pp over the frozen
# corpus head (512 tokens — the sweep's chunk length), the KV-per-token and
# fixed-GDN-state m/L laws asserted by integer cross-multiplication, and
# box-state provenance printed for every rate. Same gate as the agreement
# bin (the folded league checkpoint refuses without bonsai2_hadamard).
[[bin]]
name = "twt_perf_tg_pp"
path = "src/bin/twt_perf_tg_pp.rs"
required-features = ["twt_bonsai"]

# riir-infer Issue 022 T5.4 — the equal-FLOP skip-class arms (ShortGPT
# removal / hydra-skip class): glue-parity-gated amputation forward + the
# ShortGPT Block-Influence/greedy selection + the random floor control,
# all at the TWT kept count through the shared ternary layer body. Same
# gate as the agreement bin (the folded league checkpoint refuses without
# bonsai2_hadamard).
[[bin]]
name = "twt_skip_amputation"
path = "src/bin/twt_skip_amputation.rs"
required-features = ["twt_bonsai"]

# riir-infer Issue 014 T2(b) — the dense-parent PTQ lane on gemma-2-2b f16
# (the house fixture): the Issue-886 fits at Bench 896's held-out
# reconstruction metric on REAL parents + REAL activations. Same feature
# gate as the walk (the two lanes share the instrument family); the
# green-zero law rows apply identically.
[[bin]]
name = "act_ptq_gemma2"
path = "src/bin/act_ptq_gemma2.rs"
required-features = ["act_scale_refit"]

# riir-infer Issue 012 T2-T5 — the multi-needle@64K differential-KV-eviction
# gate (the Bench 894 model-bound quality gate): builds a needle-in-haystack
# prompt at --context tokens, runs the full-cache reference and the eviction
# arms (differential λ*, max-recent λ=0, usage-rate, prompt-pinned random)
# at the budget fractions through the ARMED qwen35-hybrid forward, and
# reports per-needle teacher-forced NLL + specificity-share retrieval, the
# trap-4 generic-continuation NLL, and a greedy free-decode runaway probe.
# Lives behind #[cfg(feature = "kv_eviction")]; the row is the reader
# protection (the green-zero law). OPT-IN, measurement-only.
[[bin]]
name = "needle_eviction_gate"
path = "src/bin/needle_eviction_gate.rs"
required-features = ["kv_eviction"]

# riir-infer Issue 013 T1 — the fitted-V P1 gate bin (calibrate → freeze →
# the four-gate battery). The module lives behind #[cfg(feature =
# "fitted_v_tables")]; this row is the reader protection (the green-zero
# law). OPT-IN, measurement-only.
[[bin]]
name = "fitted_v_gate"
path = "src/bin/fitted_v_gate.rs"
required-features = ["fitted_v_tables"]

# riir-infer Issue 013 T2 — the K=V+ λ ladder (the P2 model-bound gate):
# calibrate/load → freeze (Residual) → G3 probe → λ ladder → per-layer
# schedule grid → validation → NIAH (Bench-814 shape). Same feature gate +
# reader protection as the T1 bin. OPT-IN, measurement-only.
[[bin]]
name = "kv_plus_ladder"
path = "src/bin/kv_plus_ladder.rs"
required-features = ["fitted_v_tables"]

# riir-infer Issue 013 T3 — the P3 V-cache reconstruction gate bin: the G3
# seam probe (plain vs NoVQuant to_bits after the read-path selector), the
# paired store-vs-reconstruct G1 at λ ∈ {0, 0.5, 1} (+ the retention
# walk), the tg128 paired-interleave G2 against the full-cache control,
# and the bytes/token record (the 50% law). Consumes T2's table artifact
# (`.benchmarks/012_kv_table_residual.bin`) — no second calibration. Same
# reader protection as the T1/T2 bins. OPT-IN, measurement-only.
[[bin]]
name = "kv_reconstruct_gate"
path = "src/bin/kv_reconstruct_gate.rs"
required-features = ["vk_p3_tg"]

# riir-infer Issue 022 — the TWT gate battery (G1 planted known-answers,
# brute-force DP agreement, monotonicity, G4 alloc-free accumulate, the
# n=4096 partition perf probe). Whole-file #![cfg(feature =
# "twt_profile")] protects the count; this row protects the reader (a
# --features selection without the union SKIPS the target loudly instead

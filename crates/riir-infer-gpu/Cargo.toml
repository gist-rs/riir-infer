[package]
name = "riir-infer-gpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GPU runtime + kernel layer for the LLM inference substrate (wgpu/CubeCL)"
publish = false

# riir-infer-gpu — the GPU half of the inference substrate: device
# context, buffer helpers, the pool-poison detector, and the CubeCL
# runtime + first kernel set. Upstream of every engine by design —
# zero `riir-*` dependencies (enforced by scripts/fence_gate.py in CI).
#
# Platform shader backends follow the engine gpu crate this moved from:
#   macOS -> wgpu-msl, elsewhere -> wgpu-spirv (cubecl, optional behind
#   the `cubecl_runtime` feature).
#
# Vendor forks (workspace root [patch.crates-io], remove when upstream
# lands the fixes):
#   cubecl-runtime-0.11.0-pre.2 — drop-queue policy fix
#     (upstream tracel-ai/cubecl#1359; behavioral).
#   wgpu-hal-30.0.0 — `total_video_memory_bytes()` / `raw_handle()`
#     adapter accessors (additive API; the VRAM pre-flight probes it).

[dependencies]
# The quant zoo (Q4_K / Q8_KV block types + CPU reference GEMV) — the
# kernels' weight formats ARE these block layouts, so the dep is
# non-optional even though every current consumer sits behind
# `cubecl_runtime`. In-repo path dep (the workspace root crate).
riir-infer-core = { path = "../.." }
# The ternary weight vocabulary (TernaryGroupWeights bit-planes + the
# group-scale support the Q2_0_g128 kernels read) — consumed directly,
# katgpt-rs being the one sanctioned public upstream. Inherited from the
# workspace table so this manifest never spells the deeper sibling path.
katgpt-core = { workspace = true }
# The gpu crate speaks wgpu directly (the runtime's adapter probes + the
# context selection). The VENDORED `wgpu-hal-30.0.0` ([patch] in the root
# manifest) is the only hal whose adapter carries
# `total_video_memory_bytes` — the video-memory probe in
# cubecl_runtime.rs compiles against it and nothing else; the [patch]
# forces every wgpu-30 consumer in the graph onto it, whatever minor the
# registry resolves. (Measured 2026-09-26: the FIRST cross-workspace
# resolution of this crate — reflex's laya-riir-cubecl lane — built
# against the UN-patched hal because the reflex lock predated that
# workspace's patch rows; the fix is the patch rows in the consumer
# workspace + a lock refresh, never a version pin here.)
wgpu = "30"
# f16 weight storage (the f16 GEMV/attention/epilogue kernels).
half = { version = "2", optional = true }
# Lock-free autotune cache (gemv_autotune; read-mostly fit).
papaya = { version = "0.2", optional = true }
# blake3-keyed params-handle cache (params_cache).
blake3 = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rayon = "1.10"
# DFlash2 checkpoint header parsing (qwen38_dflash2, always-on like its home).
serde_json = "1"
# Logging facade (gemma2 KV-cache allocation size reports; the facade is
# zero-cost without a subscriber — same crate the root package uses).
log = "0.4"
# Diffusion sampler RNG (gemma2_d2f lane; version matches the engine gpu crate).
fastrand = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cubecl = { version = "=0.11.0-pre.2", features = ["wgpu-msl"], optional = true }
# Raw Metal device access for the metal::tensor matmul2d kernel family,
# macOS-only behind `metal_tensor_gemm`. Target-scoped so enabling the
# feature on Windows/Linux hosts is inert instead of pulling
# core-foundation (which does not compile on Windows MSVC).
metal = { version = "0.31", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
cubecl = { version = "=0.11.0-pre.2", features = ["wgpu-spirv"], optional = true }
# Raw CUDA dp4a/mma ternary GEMV + GEMM + the whole-prefill cudarc family
# (nvrtc-compiled kernels). Only `driver` + `nvrtc` are needed. macOS has
# no CUDA; `cuda-13030` + `fallback-dynamic-loading` match the engine gpu
# crate's declaration.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13030", "fallback-dynamic-loading"], optional = true }

[target.'cfg(windows)'.dependencies]
# Issue 031: the error path must hard-terminate — the v1 matrix FATALed and
# then hung >10 min inside process exit (CUDA driver detach-time cleanup
# under the loader lock; RAM climbing, killed by hand). TerminateProcess on
# SELF skips atexit + DLL_PROCESS_DETACH and cannot hang. Version matches
# the lock (0.61.x via cudarc) so nothing new resolves.
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[features]
# The DQ phase-sensitivity fake-quant instrument (riir-infer Plan 614 /
# Issue 026): on-device activation quantize→dequantize at five linear-input
# sites per layer, per phase, on the folded ternary forward. Default-off —
# the hot path is untouched when off (the injection blocks are cfg-gated).
# Forwards bonsai2_hadamard (the folded loader) + the prefill-lane features
# the shipping A8 lane is built from — Issue 030's first-ever lane check
# caught the gaps in sequence: (1) the pinned league artifact declares
# prism.hadamard (the loader refuses LOUDLY without bonsai2_hadamard, the
# Issue-980 guard); (2) the 734-arm8 gate hard-fails without chunked/batched
# prefill (RIIR_PREFILL_CUDA_TRACE named 'feature: ternary_deltanet_chunked_prefill');
# (3) WITHOUT the engine's kernel-selection features (ternary_gemm_simdgroup +
# both recurrence arms) the lane runs fallback kernels that compute WRONG
# LOGITS — lane-check base arith acc ≈ 0.07 vs the 0.25–0.95 admissibility
# window (3 ok / 38 bad, coherent structure, broken arithmetic, ~10× slower
# than the engine's lane). The bench MEASURES the shipping lane; it must
# BUILD the shipping lane: the engine default (riir-gpu line 503) carries all
# three. cuda_graphs_forward stays out — the bench pins
# RIIR_PREFILL_CUDA_GRAPHS=0 by its own check.
dq_phase_bench = ["cubecl_runtime", "ternary_gemv", "ternary_gemm_batched", "ternary_gemm_simdgroup", "ternary_deltanet_chunked_prefill", "ternary_attention_batched_prefill", "deltanet_recurrence_parallel", "deltanet_recurrence_rowpar", "riir-infer-core/bonsai2_hadamard"]
cubecl_runtime = ["dep:cubecl", "dep:half", "dep:papaya", "dep:blake3"]
cuda_backend = ["cubecl_runtime", "cubecl/cuda"]
# Ternary bit-plane (Q2_0_g128) GEMV family around the gemv_ternary_cubecl
# hub (decode path). Mirrors the engine gpu crate's feature MINUS its
# `riir-engine/deltanet_ternary_inference` forward leg — this crate is
# upstream of every engine and cannot dep one (the fence); consumers that
# need the engine-side forward enable that feature themselves.
ternary_gemv = ["cubecl_runtime", "katgpt-core/ternary_group_scale", "riir-infer-core/deltanet_ternary_inference"]
# Fused ternary GEMV + in-place ResidualAdd (Issue 616).
ternary_gemv_residual = ["ternary_gemv"]
# Batched ternary dequant+GEMM prefill family (Issue 637).
ternary_gemm_batched = ["ternary_gemv"]
# simdgroup/cooperative-matrix ternary GEMM (Issue 641).
ternary_gemm_simdgroup = ["ternary_gemv", "ternary_gemm_batched"]
# F16 cmma variant of the simdgroup ternary GEMM (Issue 655).
ternary_gemm_simdgroup_f16 = ["ternary_gemm_simdgroup"]
# LUT / subset-sum ternary GEMV (Issue 606 T3c path 1).
ternary_lut_gemv = ["ternary_gemv"]
# Raw CUDA dp4a/mma ternary GEMV/GEMM + the whole-prefill cudarc family.
ternary_gemv_cuda_raw = ["ternary_gemv", "dep:cudarc"]
# The single-plane activation-quant prefill arm (Issue 884 T2a).
prefill_q8_act = []
# The fork-config utilization arm; implies the q8 arm (Issue 884 T2b).
prefill_mmq_v2 = ["prefill_q8_act"]
# Raw Metal kernel family (metal::tensor / MSL passthrough), macOS-only.
metal_tensor_gemm = ["dep:metal"]
# A<->B role-swapped tiled matmul for small-M decode batches (the
# vLLM swap_ab trick). Mirrors the engine gpu crate's feature of the
# same name; implies the CubeCL runtime like it does.
swap_ab_gemm = ["cubecl_runtime"]
# Gemma 2 D2F block-causal decode (the whole module since S5: mod+tests,
# not just the SC file). Mirrors the engine gpu crate's feature minus its
# dllm forward leg chain: needs fastrand (the sampler RNG) + infer-core's
# dllm-gated Config fields (AttentionMode/NoiseSchedule) directly.
gemma2_d2f = ["cubecl_runtime", "dep:fastrand", "riir-infer-core/dllm"]
# Compile the blake3-keyed params-handle cache in (default-off
# pass-through without it). Mirrors the engine gpu crate's feature.
params_handle_cache = ["cubecl_runtime"]
# EXL3 (trellis-coded) GPU dequant kernels (Issue 001 T7b) — the 4090 arm.
# Consumes the core `exl3` reference (LUT/Hadamard tables, zero-copy layer
# view, suh/svh expansion helpers) as upload source + bit-parity oracle.
exl3_gpu = ["cubecl_runtime", "riir-infer-core/exl3"]
# Q4_K row-tiled GEMV variant (opt-in until its GOAT gate lands).
q4k_rowtiled_gemv = ["cubecl_runtime"]
# Explicit FMA contraction for the GEMV inner loops (CPU default for
# quality-sensitive decoding remains production behavior).
gemv_fma_contract = ["cubecl_runtime"]
# Kernel fold dispatch (opt-in until the >=5% GOAT proof validates).
fold_dispatch = ["cubecl_runtime"]
# Q8_KV sink-token guard arm (opt-in).
q8kv_sink_guard = ["cubecl_runtime"]
# DeltaNet chunkwise parallel prefill kernels - the chunked conv1d and the
# delta-rule chunked prefill (Issue 652 / Issue 734 T4). Mirrors the engine
# gpu crate's feature (which additionally implies ternary_gemv there).
ternary_deltanet_chunked_prefill = ["cubecl_runtime"]
# riir-ai Issue 1004 R1 (opt-in until its GOAT A/B): the multi-token
# recurrence with k/q/v staged in threadgroup memory, `rows` row-planes per
# cube. Bit-identical to the shipping multi-token kernel by construction
# (pinned by its unit test). `ternary_gemv` brings in `deltanet_cubecl`, whose
# kernel is the test's reference.
deltanet_recurrence_smem_staged = ["ternary_deltanet_chunked_prefill", "ternary_gemv"]
# riir-ai Issue 1004 R2 (opt-in until its GOAT A/B): the fused GDN prework —
# conv1d + SiLU + q/k L2-norm + head expansion in ONE dispatch reading the
# raw qkv stream once. Bit-identical to the chunked-conv + batched-expand
# chain by construction (pinned by its unit test); `ternary_gemv` brings in
# `deltanet_cubecl` (the expand kernel — the test's reference) and
# `ternary_deltanet_chunked_prefill` the chunked conv + the shared
# carry-update dispatch.
deltanet_prework_fused = ["ternary_deltanet_chunked_prefill", "ternary_gemv"]
# Row-parallel register-blocked recurrence arm (Issue 619) - cfg key for the
# chunked kernels' row-parallel internals. Mirrors the engine crate's empty
# feature.
deltanet_recurrence_rowpar = []
# Tree-masked batched verify kernels for DeltaNet layers (Issue 721). Mirrors
# the engine gpu crate's feature (which additionally pulls the
# speculative-decode dispatch there). The katgpt-core leg supplies the
# gdn_tree_verify CPU oracle the moved lib tests assert against.
speculative_tree_verify = ["cubecl_runtime", "katgpt-core/gdn_tree_verify"]
# Batched attention prefill cfg key (Issue 653) - gates the q8-KV prefill
# arm's internals alongside ternary_gemm_batched.
ternary_attention_batched_prefill = []
# Dual ANE/GPU hybrid prefill (Issue 726). The ANE executor's Metal surface
# is macOS+aarch64-gated inside the module; on other targets the feature
# compiles the (platform-independent) eligibility gate only. Pulls the metal
# dep for the macOS arm.
ane_prefill = ["dep:metal"]
# Attention-mass capture tap (diagnostics).
attn_mass_tap = ["ternary_gemm_batched", "ternary_attention_batched_prefill"]
# Speculative-decode dispatch cfg key (the tree-verify + draft arms).
speculative_decode = []
# CUDA graph capture for the cudarc whole-forward (opt-in; the engine side
# additionally gates its own graph-replay consumers).
cuda_graphs_forward = ["ternary_gemv_cuda_raw"]
# Row-parallel register-blocked recurrence arm (Issue 619 sibling).
deltanet_recurrence_parallel = []
# The dense DeltaNet forward surface (mirrors the engine gpu crate's feature
# of the same name, the engine forward leg swapped for the direct infer-core
# one). Gates hybrid_dispatch's internals.
deltanet_inference = ["cubecl_runtime", "riir-infer-core/deltanet_inference"]

# ---------------------------------------------------------------------------
# P3 slice 5 mirrors (the gemma kernel cluster). Each cfg key found in the
# moved code gets a mirror here + a forward leg on the engine gpu crate's
# own feature (so enabling it there lights the moved code through the
# re-exports — the S2 pattern).
# ---------------------------------------------------------------------------
# Gemma LoRA inference paths in the gemma2 dispatch (engine-side feature
# chain swapped for the direct infer-core one).
gemma_lora = ["riir-infer-core/gemma_lora"]
# Wall Attention (the gemma2 decode wall gate + WallConfig consumption;
# WallConfig materializes through infer-core's katgpt-core forward).
wall_attention = ["riir-infer-core/wall_attention"]
# Delta-routing Config fields the gemma2 dispatch reads.
delta_routing = ["riir-infer-core/delta_routing"]
# Q8_KV inline-dequant KV cache arm (pure gpu-side).
q8_kv_cache = ["cubecl_runtime"]
# Gamma-folded decode fusion arm (pure gpu-side).
gpu_decode_fusion = []
# CPU lm_head fallback arm (pure gpu-side).
lm_head_cpu = []
# GPU-resident training-forward dispatch helpers on the gemma dispatch
# (generic kernel launches; consumed by the engine-side test suite — the
# kv_f16_gates "test-only home" precedent for cross-crate test surface).
gpu_training_resident = ["cubecl_runtime", "gemma_lora"]
# Gemma4 stack (engine-side gemma4_inference chain swapped for the direct
# infer-core one).
gemma4_gpu = ["cubecl_runtime", "riir-infer-core/gemma4_inference"]

# The single-GEMM isolation test is whole-file #![cfg]-gated (macOS + the
# metal tensor-GEMM stack) and compiles to an empty binary elsewhere; this
# row is the reader protection (a --features selection without the union
# SKIPS the target loudly instead of printing a green zero). The
# target_os half of the gate cannot be expressed here.
# riir-ai Issue 1004 R1 — the staged-recurrence stage-isolated A/B. The
# whole-file #![cfg] keeps the count honest; this row keeps the reader honest.
[[test]]
name = "bench_1004_r1_staged_recurrence_ab"
required-features = ["deltanet_recurrence_smem_staged"]

# riir-ai Issue 1004 R2 — the fused-prework stage-isolated A/B. Whole-file
# #![cfg] + this row = the reader-protection pair (the R1 pattern).
[[test]]
name = "bench_1004_r2_prework_fused_ab"
required-features = ["deltanet_prework_fused"]

[[test]]
name = "bench_663_t5_single_gemm_isolation"
required-features = ["cubecl_runtime", "ternary_gemm_batched", "metal_tensor_gemm"]

# riir-infer Issue 032 — G1 of the Metal folded (Bonsai-2) CubeCL prefill vs
# the folded decode eager path, plus the pre-rotation pin (T5). The
# whole-file #![cfg] keeps the count honest; this row keeps the reader honest
# (the folded loader needs riir-infer-core/bonsai2_hadamard).
[[test]]
name = "g1_032_folded_prefill_metal"
required-features = ["cubecl_runtime", "ternary_gemm_batched", "ternary_deltanet_chunked_prefill", "ternary_attention_batched_prefill", "riir-infer-core/bonsai2_hadamard"]

# katgpt-rs Issue 908 / Plan 612 T2.1 — the FA-layer Q/K capture bin (the
# PISA pyramid selection gate's fixture producer; 4090 cudarc lane).
# Whole-file #![cfg] inside keeps non-CUDA hosts an empty target; this row
# is the bench_663 reader protection. blake3 + serde_json arrive via the
# feature union (cubecl_runtime activates dep:blake3; serde_json is a
# plain dependency of this crate).
[[bin]]
name = "dq_phase_matrix"
required-features = ["dq_phase_bench", "ternary_gemv_cuda_raw", "ternary_gemm_batched"]

[[bin]]
name = "qwen38_pyramid_capture"
required-features = ["ternary_gemv_cuda_raw"]

[dev-dependencies]
# Test RNG (qwen38_dflash2_gpu determinism fixtures; version matches the
# engine gpu crate's).
fastrand = "2"
# The gelu CPU reference for the plan-611-S1b elementwise tests (`erff`) —
# the same crate + version the laya lane's prod gelu calls, so the test
# compares the GPU kernel against the lane's own reference exactly.
libm = "0.2"

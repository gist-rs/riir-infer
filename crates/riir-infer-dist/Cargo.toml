[package]
name = "riir-infer-dist"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Internal substrate leaf — the release surface is the consumer crates.
publish = false

# riir-infer-dist — the multi-host pipeline lane (Plan 623 Phase 2, owner
# decision D1-a in Proposal 042): the Rust rewrite of exo's PP path.
# std-only transport (no tokio, no new crates.io dep — blake3 already rides
# riir-infer-core), authenticated frames, layer-range stage runtime over the
# Phase-1 substrate (`riir_infer_core::multi_host`). Opt-in as a whole crate,
# never a default of any consumer. The compute behind a stage is a trait, so
# the CPU reference stage (this PoC) and the Metal/CubeCL stage (T1.5 seams)
# ride the same runner.

[dependencies]
riir-infer-core = { path = "../..", features = ["multi_host", "deltanet_ternary_inference"] }
blake3 = "1"
riir-infer-gpu = { path = "../riir-infer-gpu", optional = true, features = ["cubecl_runtime", "ternary_gemv", "multi_host"] }

[dev-dependencies]
# The shared synthetic Bonsai-2 fixture kit (tests/common/synth_bonsai2.rs)
# writes f16/bf16 payloads with these — same versions as the root crate.
half = "2"
bytemuck = "1"
# The spec_drafter_floor example walks corpus_text's anyhow errors.
anyhow = "1"

[[example]]
name = "spec_drafter_floor"
path = "examples/spec_drafter_floor.rs"

# The T5.1d in-posture acceptance harness loads the REAL folded artifact —
# without the required-features row a feature-less run compiles it against
# a loader that refuses the folded GGUF (the loud-skip law instead).
[[example]]
name = "mtp_head_acceptance"
path = "examples/mtp_head_acceptance.rs"
required-features = ["bonsai2_hadamard"]

[features]
default = []
# The folded (Hadamard-rotated) Bonsai-2 loader — the real PQ2_0 artifact
# needs it; the synthetic G1 fixture does not.
bonsai2_hadamard = ["riir-infer-core/bonsai2_hadamard"]
# The GPU stage (Metal on macOS / CubeCL elsewhere) over the T1.5 range
# seams — TernaryGpuStage.
# T2.3b (promoted 2026-10-27 — G1 bit-identical to the production prefill,
# G2 1.78-1.83x 1-box / 1.30x real 2-box at P=256): the batched range
# prefill (`prefill_range_chunk` over the `ternary_gemm_batched` body) for
# chunked prompt frames.
#
# Issue 1141 (promoted 2026-10-27): riir-infer-gpu has NO defaults — the
# production decode posture lived only in riir-ai's riir-gpu defaults, so
# the lane ran the bare kernels. The posture rows below + the workspace's
# cubecl-wgpu fork (uniform-content cache) read, on idle bmo (M5 Ultra,
# real Bonsai-2 27B, interleaved): 37.24 -> 21.43-21.48 ms/token (1.74x).
# params_handle_cache is load-bearing HERE: the uniform cache alone reads
# 33.4-33.9 (a loss vs 31.5-31.7 without it); composed they read 21.4.
gpu = [
    "dep:riir-infer-gpu",
    "riir-infer-gpu/ternary_gemm_batched",
    "riir-infer-gpu/ternary_gemm_simdgroup",
    # Issue 1146 — the prefill-lane features the engine default carries
    # (riir-ai riir-gpu defaults) and this row omitted — the 1141 class one
    # list over: without chunked prefill the conv1d/recurrence run the
    # SEQUENTIAL per-token paths (128 dispatches each per deltanet layer,
    # ~21.5K dispatches/frame at chunk 128) and without batched-attention
    # prefill every attention layer runs the per-token loop — the Bench-911
    # per-frame floor (0.77-0.91 s/frame, 6-8× behind the incumbents).
    "riir-infer-gpu/ternary_deltanet_chunked_prefill",
    "riir-infer-gpu/ternary_attention_batched_prefill",
    "riir-infer-gpu/deltanet_recurrence_rowpar",
    "riir-infer-gpu/deltanet_recurrence_parallel",
    "riir-infer-gpu/delta_routing",
    "riir-infer-gpu/params_handle_cache",
]
# Issue 1146 rung 2a: the Metal tensor (matmul2d) zero-copy prefill GEMM at
# the promoted ktile64 geometry (riir-ai Bench 1009/1011: 1.16-1.24x e2e over
# the simdgroup body the `gpu` row runs, G1 exact). The league harness arms it
# via the setter; no serving binary did. This feature compiles it in and
# TernaryGpuStage arms it at construction (macOS only; a no-op elsewhere).
# Opt-in until the dist A/B — then folded into `gpu`.
gpu_metal_tensor = ["gpu", "riir-infer-gpu/metal_tensor_gemm"]

[[bin]]
name = "dist_stage"
path = "src/bin/dist_stage.rs"

# The GPU tests open with `#![cfg(feature = "gpu")]` — without these rows a
# plain `cargo test` compiles each to an EMPTY binary and prints `ok. 0 passed`
# (the cfg-gated green-zero class). The row makes cargo SKIP them loudly.
[[test]]
name = "two_stage_g1_gpu"
required-features = ["gpu"]

[[test]]
name = "two_stage_prefill_gpu"
required-features = ["gpu"]

[[test]]
name = "decode_readback_probe_gpu"
required-features = ["gpu"]

[package]
name = "riir-infer-dist"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Internal substrate leaf — the release surface is the consumer crates.
publish = false

# riir-infer-dist — the multi-host pipeline lane (Plan 623 Phase 2, owner
# decision D1-a in Proposal 042): the Rust rewrite of exo's PP path.
# std-only transport (no tokio, no new crates.io dep — blake3 already rides
# riir-infer-core), authenticated frames, layer-range stage runtime over the
# Phase-1 substrate (`riir_infer_core::multi_host`). Opt-in as a whole crate,
# never a default of any consumer. The compute behind a stage is a trait, so
# the CPU reference stage (this PoC) and the Metal/CubeCL stage (T1.5 seams)
# ride the same runner.

[dependencies]
riir-infer-core = { path = "../..", features = ["multi_host", "deltanet_ternary_inference"] }
blake3 = "1"
riir-infer-gpu = { path = "../riir-infer-gpu", optional = true, features = ["cubecl_runtime", "ternary_gemv", "multi_host"] }
# T3.2's MTLBuffer probe ONLY (`verbs_metal` example, `rdma_metal` feature):
# a shared-storage MTLBuffer's contents() registered as an RDMA MR. One
# workspace version shared with riir-infer-gpu (the BOUNDARY.md metal row);
# inert unless the feature is named.
metal = { version = "0.31", optional = true }

[dev-dependencies]
# The shared synthetic Bonsai-2 fixture kit (tests/common/synth_bonsai2.rs)
# writes f16/bf16 payloads with these — same versions as the root crate.
half = "2"
bytemuck = "1"
# The spec_drafter_floor example walks corpus_text's anyhow errors.
anyhow = "1"

[[example]]
name = "spec_drafter_floor"
path = "examples/spec_drafter_floor.rs"

# The T5.1d in-posture acceptance harness loads the REAL folded artifact —
# without the required-features row a feature-less run compiles it against
# a loader that refuses the folded GGUF (the loud-skip law instead).
[[example]]
name = "mtp_head_acceptance"
path = "examples/mtp_head_acceptance.rs"
required-features = ["bonsai2_hadamard"]

# Plan 623 Phase 3 — the RDMA ping/MTU/bandwidth probe over the TB
# bridge (T3.1 bring-up + T3.2/T3.3 rows). macOS only (see the rdma
# feature row).
[[example]]
name = "verbs_ping"
path = "examples/verbs_ping.rs"
required-features = ["rdma"]

# T3.2 — the rkey-semantics probe: an RC/UC QP pair exercising RDMA WRITE
# (+ RDMA READ over RC) against a target-registered MR, plus the per-
# access-flag rkey grant matrix. macOS only (rides the rdma lane).
[[example]]
name = "verbs_write"
path = "examples/verbs_write.rs"
required-features = ["rdma"]

# T3.2 — the MTLBuffer registration probe: a shared-storage MTLBuffer's
# contents() as an RDMA MR, with the GPU↔wire byte-identity checks (GPU
# blit-filled bytes cross the wire; wire-written bytes are read back by a
# GPU compute kernel). macOS only; needs Metal + the rdma lane.
[[example]]
name = "verbs_metal"
path = "examples/verbs_metal.rs"
required-features = ["rdma_metal"]

[features]
default = []
# Plan 623 Phase 3 T3.1 — the verbs FFI lane. macOS-ONLY by contract: the
# ibv_context ops vtable layout is Apple's librdma.dylib header's
# (rdma-core on Linux evolved its own and is not claimed). On non-macOS
# the feature compiles to nothing — that scoping is deliberate and
# documented, not a lane.
rdma = []
# T3.2's MTLBuffer probe — implies the verbs lane, adds the metal crate
# (macOS target-scoped by the BOUNDARY.md row; on non-macOS the feature
# compiles the metal dep to nothing, same inert law as laya-riir-metal).
rdma_metal = ["dep:metal", "rdma"]
# The folded (Hadamard-rotated) Bonsai-2 loader — the real PQ2_0 artifact
# needs it; the synthetic G1 fixture does not.
bonsai2_hadamard = ["riir-infer-core/bonsai2_hadamard"]
# The GPU stage (Metal on macOS / CubeCL elsewhere) over the T1.5 range
# seams — TernaryGpuStage.
# T2.3b (promoted 2026-10-27 — G1 bit-identical to the production prefill,
# G2 1.78-1.83x 1-box / 1.30x real 2-box at P=256): the batched range
# prefill (`prefill_range_chunk` over the `ternary_gemm_batched` body) for
# chunked prompt frames.
#
# Issue 1151 — Production posture: the promoted serving rungs live ONE
# place now, the substrate's `production` aggregate (GOAT-gated; joining
# it IS the promotion act). This row forwards that ONE name and no longer
# hand-types the set. History of the class that killed the hand-typed
# list: Issue 1141 (promoted 2026-10-27) — riir-infer-gpu has NO defaults,
# the production decode posture lived only in riir-ai's riir-gpu defaults,
# and the lane ran the bare kernels: 37.24 -> 21.43-21.48 ms/token (1.74x)
# once repaired (params_handle_cache load-bearing: alone a loss 33.4-33.9
# vs 31.5-31.7 without it; composed 21.4). Issue 1146 — the prefill-lane
# features the engine default carries (riir-ai riir-gpu defaults) and this
# row omitted — the 1141 class one list over: without chunked prefill the
# conv1d/recurrence run the SEQUENTIAL per-token paths (128 dispatches each
# per deltanet layer, ~21.5K dispatches/frame at chunk 128) and without
# batched-attention prefill every attention layer runs the per-token loop
# — the Bench-911 per-frame floor (0.77-0.91 s/frame, 6-8× behind the
# incumbents). Issue 1146 rung 2a (promoted 2026-10-28, Bench 920) — the
# Metal tensor (matmul2d) zero-copy prefill GEMM at the promoted ktile64
# geometry was league-armed (riir-ai Bench 1009/1011, 1.16-1.24x) and no
# serving binary carried it; dist A/B 1.21-1.29x prefill, G1 identical
# token stream once the cold-pool zero-init hazard was fixed (3bbf275);
# `RIIR_DIST_METAL_TENSOR=0` demotes; the code is target_os-gated, so
# non-macOS builds are unchanged. The posture floor
# tests/gpu_production_posture_floor.rs reds if a hand-typed list returns
# here or the substrate manifest drains. Lane-specific seams stay on the
# base dep row above (multi_host range runtime).
gpu = [
    "dep:riir-infer-gpu",
    "riir-infer-gpu/production",
]

[[bin]]
name = "dist_stage"
path = "src/bin/dist_stage.rs"

# The GPU tests open with `#![cfg(feature = "gpu")]` — without these rows a
# plain `cargo test` compiles each to an EMPTY binary and prints `ok. 0 passed`
# (the cfg-gated green-zero class). The row makes cargo SKIP them loudly.
[[test]]
name = "two_stage_g1_gpu"
required-features = ["gpu"]

[[test]]
name = "two_stage_prefill_gpu"
required-features = ["gpu"]

[[test]]
name = "decode_readback_probe_gpu"
required-features = ["gpu"]

# Plan-623 T3.4 (issue 1151) — the decode-feed async-finish gates: hidden-bit
# identity vs the sync arm + the all-feed s=2 A/B on the real 27B.
[[test]]
name = "t34_async_finish_gpu"
required-features = ["gpu", "bonsai2_hadamard"]

# Issue 1151 — the posture floor: reds NAMING any promoted rung this
# posture fails to compile (the guard against re-introducing a hand-typed
# rung list here) and against a drained PRODUCTION_RUNGS manifest (the
# green-zero defense). See the test's own doc for what it does and does
# not claim.
[[test]]
name = "gpu_production_posture_floor"
required-features = ["gpu"]

# The verbs FFI layout pins + endpoint codec + dlopen resolution
# (feature-gated with its required-features row — the green-zero law).
[[test]]
name = "verbs_layout"
required-features = ["rdma"]

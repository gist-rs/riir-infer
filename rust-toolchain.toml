# The toolchain floor is a hard dependency requirement, not taste.
#
# `cubecl 0.11.0-pre.2` pulls `cubecl-zspace 0.11.0-pre.2`, which declares
# `rust-version = "1.95"`. Cargo enforces that at RESOLUTION time, so on an
# older toolchain every command in this workspace fails — not just the GPU
# builds. The pin below satisfies the floor and matches the toolchain the
# development boxes run (stable), so `cargo build` works out of the box.
#
# Raising this is a deliberate act: bump `channel` in its own reviewed
# commit and fix the new lints there.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
